name: Lint
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run ruff lint and format check
        run: |
          uv run --frozen ruff check grow/ extensions/ install.py
          uv run --frozen ruff format --check grow/ extensions/ install.py
