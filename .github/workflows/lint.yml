name: Lint
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run ruff lint and format check
        run: |
          uv run --frozen ruff check grow/ install.py
          uv run --frozen ruff format --check grow/ install.py
