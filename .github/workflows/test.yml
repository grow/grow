name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Build UI assets
        run: |
          yarn --cwd grow/ui install
          yarn --cwd grow/ui build
      - name: Run tests
        run: uv run pytest --cov=grow --cov-report=xml
      - name: Smoke test build
        run: uv run grow build ./grow/testing/testdata/pod
