name: Test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest --cov=grow --cov-report=xml
      - name: Smoke test builds
        run: |
          uv run --frozen grow build ./grow/testing/testdata/pod
          uv run --frozen grow build ./docs
          uv run --frozen grow build ./examples/starter
