name: Test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run tests
        run: |
          uv run --frozen pytest --cov=grow --cov-report=xml
          PYTHONPATH="extensions/editor:extensions/google-cloud-images:extensions/google-cloud-images/backend:extensions/google-drive-to-gcs:extensions/google-forms:extensions/greenhouse:extensions/html-min:extensions/kintaro:extensions/responsive-styles:extensions/xml-feed" uv run --frozen pytest extensions/
      - name: Smoke test builds
        run: |
          uv run --frozen grow build ./grow/testing/testdata/pod
          uv run --frozen grow build ./docs
          uv run --frozen grow build ./examples/starter
