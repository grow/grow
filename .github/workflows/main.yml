name: 'Push to main'
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional existing git tag to publish to PyPI and Docker (e.g. v2.3.0)'
        required: false
        type: string
jobs:
  # Evergreen docker image build from main.
  docker-image:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            grow/base
            ghcr.io/${{ github.repository }}
      - name: Push grow/base
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: grow_version=git+https://github.com/grow/grow.git@main

  # Release please configuration for deployment.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@v3
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: python
      - name: Resolve publish target
        id: target
        shell: bash
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_VERSION: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUBLISH_TAG" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "ref=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"
            echo "version=${PUBLISH_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.target.outputs.should_publish == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - if: ${{ steps.target.outputs.should_publish == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - if: ${{ steps.target.outputs.should_publish == 'true' }}
        name: Build package
        run: |
          rm -rf dist
          uv build
      - if: ${{ steps.target.outputs.should_publish == 'true' }}
        name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - if: ${{ steps.target.outputs.should_publish == 'true' }}
        name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - if: ${{ steps.target.outputs.should_publish == 'true' }}
        name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.target.outputs.should_publish == 'true' }}
        name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            grow/base
            ghcr.io/${{ github.repository }}
      - if: ${{ steps.target.outputs.should_publish == 'true' }}
        name: Push grow/base
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }},grow/base:latest,grow/base:${{ steps.target.outputs.version }},ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ steps.target.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: grow_version=grow==${{ steps.target.outputs.version }}
