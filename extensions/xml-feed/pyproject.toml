[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "grow-ext-xml-feed"
version = "2.0.0"
description = "Grow extension for importing RSS/XML feeds as Grow documents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grow.dev Authors", email = "code@grow.dev" },
]
dependencies = []

[project.urls]
Homepage = "https://grow.dev"
Repository = "https://github.com/grow/grow"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
include = ["xml_feed*"]
