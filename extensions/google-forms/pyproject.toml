[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "grow-ext-google-forms"
version = "2.0.0"
description = "Grow preprocessor for importing Google Forms definitions into YAML."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grow.dev Authors", email = "code@grow.dev" },
]
dependencies = []

[project.urls]
Homepage = "https://grow.dev"
Repository = "https://github.com/grow/grow"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["google_forms*"]

[tool.setuptools.package-data]
google_forms = ["*.html"]
