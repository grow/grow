[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "grow-ext-google-drive-to-gcs"
version = "2.0.0"
description = "Grow Jinja2 extension for syncing Google Drive files to Google Cloud Storage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grow.dev Authors", email = "code@grow.dev" },
]
dependencies = []

[project.urls]
Homepage = "https://grow.dev"
Repository = "https://github.com/grow/grow"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
include = ["google_drive_to_gcs*"]
