[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "grow-ext-google-cloud-images"
version = "2.0.0"
description = "Grow extension for serving images from Google Cloud Storage via Google's dynamic image-serving infrastructure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grow.dev Authors", email = "code@grow.dev" },
]
dependencies = []

[project.urls]
Homepage = "https://grow.dev"
Repository = "https://github.com/grow/grow"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
include = ["google_cloud_images*"]
