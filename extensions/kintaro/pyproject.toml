[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "grow-ext-kintaro"
version = "2.0.0"
description = "Grow preprocessor and Jinja2 extension for binding Kintaro CMS content."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grow.dev Authors", email = "code@grow.dev" },
]
dependencies = []

[project.urls]
Homepage = "https://grow.dev"
Repository = "https://github.com/grow/grow"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["kintaro*"]

[tool.setuptools.package-data]
kintaro = ["*.html"]
