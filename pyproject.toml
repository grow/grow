[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "grow"
version = "2.2.3"
description = "Develop everywhere and deploy anywhere: a declarative site generator for rapid, high-quality web site production."
readme = "description.txt"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Grow.dev Authors", email = "code@grow.dev" },
]
keywords = [
    "grow",
    "cms",
    "static site generator",
    "content management",
]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "babel==2.9.1",
    "beautifulsoup4==4.9.1",
    "click==7.1.2",
    "gitpython==3.1.3",
    "google-api-python-client==1.9.3",
    "html2text==2020.1.16",
    "httplib2==0.19.0",
    "jinja2==2.11.3",
    "markdown==3.3.4",
    "markupsafe==2.0.1",
    "oauth2client==4.1.3",
    "protorpc==0.12.0",
    "pygments==2.7.4",
    "python-slugify==4.0.0",
    "pyyaml>=6.0.1,<7",
    # google-api-python-client==1.9.3 imports pkg_resources (removed in setuptools 81).
    "setuptools<81",
    "translitcodec==0.6.0",
    "watchdog==0.10.2",
    "webob==1.8.6",
    "webreview==0.3.1",
    "werkzeug==1.0.1",
]

[project.urls]
Homepage = "https://grow.dev"
Repository = "https://github.com/grow/grow"

[project.scripts]
grow = "grow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["grow*"]
exclude = ["lib*", "node_modules*"]

[tool.pytest.ini_options]
testpaths = ["grow"]
python_files = ["*_test.py"]

[tool.coverage.run]
source = ["grow"]
omit = [
    "grow/templates/jinja_dependency.py",
]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    "grow/testing/testdata",
    "grow/ui/node_modules",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "PERF102",
    "PIE",
    "SIM102",
    "SIM103",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM118",
    "SIM401",
    "W605",
    "RUF015",
]
ignore = [
    "E731",
    "B904",
]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["grow"]
