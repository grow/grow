[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "grow"
version = "2.5.0"
description = "Develop everywhere and deploy anywhere: a declarative site generator for rapid, high-quality web site production."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grow.dev Authors", email = "code@grow.dev" },
]
keywords = [
    "grow",
    "cms",
    "static site generator",
    "content management",
]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "babel>=2.14,<3",
    "click>=8.1,<9",
    "gitpython>=3.1.41,<4",
    "google-api-python-client>=2.150,<3",
    "html2text>=2024.2.26",
    "httplib2>=0.22,<1",
    "jinja2>=3.1.6,<4",
    "markdown>=3.5,<4",
    "markupsafe>=2.1,<4",
    "oauth2client==4.1.3",
    "protorpc==0.12.0",
    "pygments>=2.17,<3",
    "python-slugify>=8,<9",
    "pyyaml>=6.0.1,<7",
    "watchdog>=3,<5",
    "webob>=1.8.8,<2",
    "webreview==0.3.1",
    "werkzeug>=3.1,<4",
]

[project.urls]
Homepage = "https://grow.dev"
Repository = "https://github.com/grow/grow"

[project.scripts]
grow = "grow.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["grow*"]
exclude = ["lib*", "node_modules*"]

[tool.pytest.ini_options]
testpaths = ["grow"]
python_files = ["*_test.py"]
filterwarnings = [
    # Third-party deprecation/user warnings from pinned v2.x dependencies.
    "ignore:Cannot access .*grow-sdk:UserWarning:oauth2client",
    "ignore:'cgi' is deprecated:DeprecationWarning:protorpc",
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:protorpc",
]

[tool.coverage.run]
source = ["grow"]
omit = [
    "grow/templates/jinja_dependency.py",
]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    "grow/testing/testdata",
    "grow/ui/node_modules",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "PERF102",
    "PIE",
    "SIM102",
    "SIM103",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM118",
    "SIM401",
    "W605",
    "RUF015",
]
ignore = [
    "E731",
    "B904",
]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["grow"]

[tool.ruff.format]
quote-style = "single"
