title@: Grow
grow_version: ">=2.0.0"
home: /content/docs/get-started/index.md
root: "/"

meta:
  site_name: "Grow"
  site_logo_path: '/source/images/grow.svg'
  site_author: "Grow Authors"
  favicon_path: /source/images/icon.png
  header_button_url: "https://github.com/grow/grow"
  header_button_label: GitHub
  pypi_name: grow
  license_badge: MIT
  github_project: grow/grow

localization:
  default_locale: en
  locales:
    - en

static_dirs:
  - static_dir: /static/
    serve_at: "{root}/static/"
    fingerprinted: true
  - static_dir: /source/images/
    serve_at: "/{root}/assets/images/"

sitemap:
  enabled: true

markdown:
  extensions:
    - kind: markdown.extensions.codehilite
      theme: github-dark
    - kind: sourcecode
      theme: github-dark

deployments:
  prod:
    destination: local
    out_dir: ./build/
    env:
      name: prod
      host: grow.dev
      scheme: https
