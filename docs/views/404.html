{% extends "/views/base.html" %}

{% block shell %}
<main class="pixel-404-shell" role="main">
  <section class="pixel-404" aria-labelledby="pixel-404-title">
  <div class="pixel-404__art" aria-hidden="true">
    <svg width="240" height="128" viewBox="0 0 60 32" shape-rendering="crispEdges" role="img">
      <!-- Twinkling 8-bit stars -->
      <rect x="4" y="4" width="1" height="1" fill="#94a3b8"/>
      <rect x="11" y="10" width="1" height="1" fill="#cbd5e1"/>
      <rect x="48" y="5" width="1" height="1" fill="#94a3b8"/>
      <rect x="54" y="12" width="1" height="1" fill="#cbd5e1"/>
      <rect x="7" y="24" width="1" height="1" fill="#cbd5e1"/>
      <rect x="52" y="25" width="1" height="1" fill="#94a3b8"/>
      <!-- 8-bit Rocket -->
      <!-- Nose cone -->
      <rect x="29" y="2" width="2" height="1" fill="#d11d67"/>
      <rect x="28" y="3" width="4" height="1" fill="#d11d67"/>
      <rect x="27" y="4" width="6" height="1" fill="#ea3c84"/>
      <!-- Body -->
      <rect x="27" y="5" width="6" height="6" fill="#e2e8f0"/>
      <rect x="28" y="5" width="4" height="6" fill="#ffffff"/>
      <!-- Porthole window -->
      <rect x="29" y="6" width="2" height="2" fill="#3b415e"/>
      <!-- Fins -->
      <rect x="25" y="9" width="2" height="3" fill="#d11d67"/>
      <rect x="33" y="9" width="2" height="3" fill="#d11d67"/>
      <rect x="27" y="11" width="6" height="1" fill="#3b415e"/>
      <!-- Exhaust flame -->
      <rect x="28" y="12" width="4" height="1" fill="#f59e0b"/>
      <rect x="29" y="13" width="2" height="1" fill="#fbbf24"/>
      <rect x="29" y="14" width="2" height="1" fill="#d11d67"/>

      <!-- Pixel "404" numerals -->
      <!-- 4 -->
      <rect x="15" y="18" width="2" height="6" fill="#3b415e"/>
      <rect x="17" y="22" width="4" height="2" fill="#3b415e"/>
      <rect x="21" y="18" width="2" height="10" fill="#3b415e"/>
      <!-- 0 -->
      <rect x="27" y="18" width="6" height="2" fill="#d11d67"/>
      <rect x="26" y="20" width="2" height="6" fill="#d11d67"/>
      <rect x="32" y="20" width="2" height="6" fill="#d11d67"/>
      <rect x="27" y="26" width="6" height="2" fill="#d11d67"/>
      <!-- 4 -->
      <rect x="37" y="18" width="2" height="6" fill="#3b415e"/>
      <rect x="39" y="22" width="4" height="2" fill="#3b415e"/>
      <rect x="43" y="18" width="2" height="10" fill="#3b415e"/>
    </svg>
  </div>

  <div class="pixel-404__badge">ERROR 404</div>
  <h1 id="pixel-404-title" class="pixel-404__title">Lost in orbit</h1>
  <p class="pixel-404__body">
    Looks like this route drifted off the podspec. Try the search bar above or warp back to safety.
  </p>
  <div class="pixel-404__actions">
    <a class="pixel-404__btn pixel-404__btn--primary" href="/">Back to Home<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l14 0"/><path d="M13 18l6 -6"/><path d="M13 6l6 6"/></svg></a>
    <a class="pixel-404__btn pixel-404__btn--secondary" href="/codelab/">Browse Codelab</a>
  </div>
</section>
</main>
{% endblock %}
